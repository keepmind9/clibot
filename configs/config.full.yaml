# ==============================================================================
# Hook Server
# ==============================================================================
# HTTP server for CLI tools to notify clibot when they finish processing
# Not needed if all sessions use ACP or stdio mode
hook_server:
  port: 8080

# ==============================================================================
# Logging Configuration
# ==============================================================================
logging:
  level: info
  # file: /var/log/clibot/clibot.log
  max_size: 100
  max_backups: 5
  max_age: 30
  compress: true
  enable_stdout: true
