# ==============================================================================
# clibot Configuration Example
# ==============================================================================
# This is an example configuration file for clibot.
#
# Quick Start:
#   1. Copy this file to ~/.config/clibot/config.yaml
#   2. Fill in your bot credentials (see guides below)
#   3. Add your user ID to the whitelist
#   4. Run: clibot serve --config ~/.config/clibot/config.yaml
#
# For detailed setup guides, see: docs/en/setup/
#
# ==============================================================================
# Environment Variables (RECOMMENDED for sensitive data)
# ==============================================================================
# You can use environment variables for sensitive configuration like tokens
# and secrets. This keeps them out of your config file.
#
# Syntax: Use DOLLAR_SIGN + BRACES + ENV_NAME, e.g., DISCORD_TOKEN with $ and {}
#
# Setting environment variables:
#   Linux/Mac:     export DISCORD_TOKEN="your_token_here"
#   Windows (cmd):  set DISCORD_TOKEN=your_token_here
#   Windows (PS):  env:DISCORD_TOKEN="your_token_here"
#   Docker:        -e DISCORD_TOKEN="your_token_here"
#
# Benefits:
#   - More secure: credentials not in config file
#   - Easier deployment: different envs for dev/prod
#   - Git friendly: can commit config without exposing secrets
# ==============================================================================

# ==============================================================================
# Security Configuration (IMPORTANT)
# ==============================================================================
# clibot is essentially a Remote Code Execution (RCE) tool.
# Whitelist MUST be enabled to prevent unauthorized access.
security:
  whitelist_enabled: true

  # Allowed users - Add your user IDs here
  #
  # How to get your user ID:
  #   - Telegram: Send any message to your bot, then use 'echo' command
  #   - Discord: Send any message, use 'echo' command to see your User ID
  #   - Feishu: Use 'echo' command to see your open_id
  #   - DingTalk: Use 'echo' command to see your staff_id
  allowed_users:
    telegram:
      - "YOUR_TELEGRAM_USER_ID"     # Replace with your Telegram user_id (number)

    discord:
      - "YOUR_DISCORD_USER_ID"      # Replace with your Discord user_id (snowflake)

    feishu:
      - "YOUR_FEISHU_OPEN_ID"       # Replace with your Feishu open_id

    dingtalk:
      - "YOUR_DINGTALK_STAFF_ID"    # Replace with your DingTalk staff_id

  # Admin list - Users who can create/delete dynamic sessions
  admins:
    telegram:
      - "YOUR_TELEGRAM_USER_ID"

    discord:
      - "YOUR_DISCORD_USER_ID"

    feishu:
      - "YOUR_FEISHU_OPEN_ID"

# ==============================================================================
# Network Proxy Configuration (OPTIONAL)
# ==============================================================================
# Configure proxy for accessing IM platforms in restricted networks
#
# Priority:
#   1. Bot-level proxy (highest) - bots.<name>.proxy
#   2. Global proxy - this section
#   3. Environment variables - HTTP_PROXY, HTTPS_PROXY, ALL_PROXY (default)
#
# Supported proxy types:
#   - http: HTTP/HTTPS proxy (e.g., http://127.0.0.1:7890)
#   - socks5: SOCKS5 proxy (e.g., socks5://127.0.0.1:1080)
# ==============================================================================
proxy:
  enabled: false
  url: "http://127.0.0.1:7890"
  # username: ""
  # password: ""

  # Example SOCKS5 with authentication:
  # enabled: true
  # url: "socks5://proxy.example.com:1080"
  # username: "user"
  # password: "pass"

# ==============================================================================
# CLI Configuration
# ==============================================================================
# Three layers with clear responsibilities:
#
#   cli_adapters      Type-level shared config (timeout, env)
#       ↓
#   sessions          Static session instances (created at startup)
#   session_templates Dynamic session blueprints (created via `sn` command)
#
# Env merge order: cli_adapters.env → sessions.env / session_templates.env
# ==============================================================================

# --- Layer 1: CLI Adapters (shared config per CLI type) ---
#
# Configure timeout and environment for each CLI tool.
# Settings here are shared by all sessions using this cli_type.
#
# Supported types:
#   acp             - Agent Client Protocol (recommended)
#   claude          - Claude Code hook mode
#   gemini          - Gemini CLI hook mode
#   opencode        - OpenCode CLI hook mode
#   codex-stdio     - Codex CLI per-turn mode
#   claude-stdio    - Claude Code per-turn mode
#   gemini-stdio    - Gemini CLI per-turn mode
#   opencode-stdio  - OpenCode CLI per-turn mode
#
cli_adapters:
  # --- ACP Adapter (recommended) ---
  # Timeout = max idle time before cancelling request
  acp:
    timeout: "5m"
    # env:
    #   ANTHROPIC_API_KEY: "sk-ant-..."

  # --- Hook Mode Adapters ---
  claude:
  gemini:
  opencode:

  # --- Stdio Mode Adapters (per-turn, zero config) ---
  codex-stdio:
    timeout: "5m"
    # env:
    #   OPENAI_API_KEY: "sk-..."

  claude-stdio:
    timeout: "5m"
    # env:
    #   ANTHROPIC_API_KEY: "sk-ant-..."

  gemini-stdio:
    timeout: "5m"
    # env:
    #   GEMINI_API_KEY: "your-key"

  opencode-stdio:
    timeout: "5m"

# --- Layer 2: Static Sessions (created at startup) ---
#
# Each session is a connection to an AI CLI tool.
# - name: your custom identifier (e.g., "my-project", "backend-api")
# - cli_type: references a key in cli_adapters above
#
sessions:
  # --- ACP Mode (best experience, streaming, no tmux) ---

  - name: "my-acp-session"
    cli_type: "acp"
    work_dir: "/home/user/projects/my-project"
    start_cmd: "claude-agent-acp"
    transport: "stdio://"
    auto_start: true
    # env:
    #   ANTHROPIC_API_KEY: "sk-ant-..."

  # - name: "my-gemini-acp"
  #   cli_type: "acp"
  #   work_dir: "/home/user/projects/my-project"
  #   start_cmd: "gemini --experimental-acp"
  #   transport: "stdio://"
  #   auto_start: true

  # - name: "my-remote"
  #   cli_type: "acp"
  #   work_dir: "/home/user/projects/demo"
  #   transport: "tcp://127.0.0.1:9000"

  # - name: "my-unix"
  #   cli_type: "acp"
  #   work_dir: "/home/user/projects/demo"
  #   transport: "unix:///tmp/acp.sock"

  # --- Hook Mode (requires CLI hook configuration) ---

  # - name: "my-project"
  #   cli_type: "claude"
  #   work_dir: "/home/user/projects/my-project"
  #   auto_start: true

  # - name: "my-tests"
  #   cli_type: "gemini"
  #   work_dir: "/home/user/backend-tests"
  #   auto_start: false

  # - name: "my-work"
  #   cli_type: "opencode"
  #   work_dir: "/path/to/workdir"
  #   auto_start: true

  # --- Stdio Mode (per-turn, no tmux or hook needed) ---

  # - name: "claude-stdio"
  #   cli_type: "claude-stdio"
  #   work_dir: "/home/user/projects/my-project"

  # - name: "codex-stdio"
  #   cli_type: "codex-stdio"
  #   work_dir: "/home/user/projects/my-project"

  # - name: "gemini-stdio"
  #   cli_type: "gemini-stdio"
  #   work_dir: "/home/user/projects/my-project"

  # - name: "opencode-stdio"
  #   cli_type: "opencode-stdio"
  #   work_dir: "/home/user/projects/my-project"

# --- Layer 3: Session Templates (for `sn` command) ---
#
# Reusable blueprints for creating sessions via IM.
# Built-in templates (zero config): codex, claude, gemini, opencode
#
# Usage:
#   sn codex /my/project           → auto-name: codex-project
#   sn claude /data/app/demo        → auto-name: claude-demo
#   sn codex /data/app/demo myname  → custom name: myname
#
# User-defined templates override built-in defaults.
# Multiple templates can share the same cli_type (N:1 relationship).
#
session_templates:
  # Example: codex with yolo mode (overrides built-in "codex" template)
  # codex:
  #   cli_type: codex-stdio
  #   yolo: true

  # Example: custom template using same adapter as built-in
  # codex-safe:
  #   cli_type: codex-stdio
  #   yolo: false
  #   env:
  #     OPENAI_API_KEY: "sk-..."

# Global session settings
session:
  max_dynamic_sessions: 50

