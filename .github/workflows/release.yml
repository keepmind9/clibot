name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          # Normalize version to always have v prefix
          if [ "${VERSION}" != "${VERSION#v}" ]; then
            VERSION_DISPLAY="${VERSION#v}"
          else
            VERSION_DISPLAY="${VERSION}"
            VERSION="v${VERSION}"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "VERSION_DISPLAY=${VERSION_DISPLAY}" >> $GITHUB_ENV

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: make test

      - name: Build all platforms
        run: make build-release

      - name: Display build artifacts
        run: |
          echo "Build artifacts:"
          ls -lh bin/

      - name: Generate release notes
        id: release_notes
        run: |
          cat > release_notes.md << 'EOF'
          ## Clibot ${{ env.VERSION_DISPLAY }}

          ### Quick Install

          **Linux / macOS:**
          \`\`\`bash
          curl -sL https://raw.githubusercontent.com/keepmind9/clibot/main/scripts/install.sh | bash
          \`\`\`

          **Windows (PowerShell):**
          \`\`\`powershell
          irm https://raw.githubusercontent.com/keepmind9/clibot/main/scripts/install.ps1 | iex
          \`\`\`

          **Self-update (already installed):**
          \`\`\`bash
          clibot update
          \`\`\`

          ### Verify Checksum

          **Linux/macOS:**
          \`\`\`bash
          sha256sum -c checksums-sha256.txt
          \`\`\`

          **Windows (PowerShell):**
          \`\`\`powershell
          Get-FileHash clibot.exe -Algorithm SHA256
          \`\`\`

          ---

          Full Changelog: https://github.com/${{ github.repository }}/compare/${{ env.VERSION }}
          EOF

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: Clibot ${{ env.VERSION_DISPLAY }}
          body_path: release_notes.md
          draft: false
          prerelease: false
          files: |
            bin/clibot-${{ env.VERSION_DISPLAY }}-linux-amd64.tar.gz
            bin/clibot-${{ env.VERSION_DISPLAY }}-linux-arm64.tar.gz
            bin/clibot-${{ env.VERSION_DISPLAY }}-darwin-amd64.tar.gz
            bin/clibot-${{ env.VERSION_DISPLAY }}-darwin-arm64.tar.gz
            bin/clibot-${{ env.VERSION_DISPLAY }}-windows-amd64.zip
            bin/checksums-sha256.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}